services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - attendance-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - attendance-network
    restart: unless-stopped

networks: 
  attendance-network:
    driver: bridge